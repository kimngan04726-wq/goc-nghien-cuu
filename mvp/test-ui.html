<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử giao diện Trang A — project thử</title><style>body{font:16px system-ui;max-width:760px;margin:25px auto;padding:0 16px}label{display:block;margin:12px 0}input{width:100%;box-sizing:border-box;padding:10px}button{padding:10px;margin:6px}#app{padding:12px;background:#eee}.warn{background:#fff2d7;padding:14px}#research .card{padding:12px;border:1px solid #aaa;margin:8px 0}</style></head><body>
<h1>Kiểm thử giao diện Trang A</h1><p class="warn">CHỈ nhập Supabase project THỬ. Không dùng khóa secret/service_role. Không dùng website thật. Mở file này cùng thư mục với <code>trang-a.js</code>.</p>
<label>Project URL thử<input id="url" placeholder="https://PROJECT.supabase.co"></label><label>Publishable/anon key thử<input id="key" type="password"></label><label>Email thử<input id="email" type="email"></label><label>Mật khẩu thử<input id="password" type="password"></label>
<button id="login">Đăng nhập</button><button id="directUpdate" disabled>TEST ADMIN: thử UPDATE content trực tiếp (phải bị chặn)</button><button id="logout" disabled>Đăng xuất</button><button id="open" disabled>Mở giao diện Trang A</button><p id="result" aria-live="polite"></p>
<div id="app" class="hidden"><h2>Mô phỏng khu vực nghiên cứu (không phải website thật)</h2><div id="research"><div class="card">Nhiệm vụ 1</div><div class="card">Nhiệm vụ 2</div><div class="card">Nhiệm vụ 3</div><div class="card">Nhiệm vụ 4</div><div class="card">Nhiệm vụ 5</div><div class="card">Nhiệm vụ 6</div><div class="card">Nhiệm vụ 7</div></div><div id="researchDetail"><div class="research-work-box"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
let db=null,isAdmin=false,editingPageId=1;
const $=id=>document.getElementById(id),msg=t=>$('result').textContent=t;
$('login').onclick=async()=>{try{const u=new URL($('url').value.trim());if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(u.href))throw Error('Project URL không đúng dạng https://PROJECT.supabase.co');const k=$('key').value.trim();if(!k||k.startsWith('sb_secret_'))throw Error('Không dùng secret key');db=window.supabase.createClient(u.origin,k,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';const p=await db.from('group_profiles').select('role').eq('user_id',data.user.id).single();if(p.error)throw p.error;isAdmin=p.data?.role==='admin';$('app').classList.remove('hidden');$('logout').disabled=false;$('open').disabled=false;$('directUpdate').disabled=!isAdmin;msg('Đã đăng nhập với vai trò '+(p.data?.role||'không rõ')+'. Bấm Mở giao diện Trang A.');if(!window.openMvpResearchA){const s=document.createElement('script');s.src='./trang-a.js';s.onerror=()=>msg('Không tải được trang-a.js; kiểm tra hai file cùng thư mục');document.body.append(s)}}catch(e){msg('Lỗi: '+e.message)}};
$('open').onclick=()=>{if(typeof window.openMvpResearchA==='function')window.openMvpResearchA(1);else msg('Đang tải JS, thử bấm lại sau một giây')};
$('logout').onclick=async()=>{if(db)await db.auth.signOut();$('app').classList.add('hidden');$('open').disabled=true;$('directUpdate').disabled=true;$('logout').disabled=true;msg('Đã đăng xuất; tải lại trang trước khi đăng nhập tài khoản khác')};
$('directUpdate').onclick=async()=>{try{if(!db||!isAdmin)throw Error('Chỉ chạy khi đăng nhập Admin thử');const {data:row,error:readError}=await db.from('mvp_subsections').select('content').eq('task_key',1).eq('subsection_key','01').single();if(readError)throw readError;const {data,error}=await db.from('mvp_subsections').update({content:row.content}).eq('task_key',1).eq('subsection_key','01').select('task_key');if(error){msg('PASS: Admin UPDATE trực tiếp content bị từ chối: '+error.message)}else{msg('FAIL NGHIÊM TRỌNG: Admin UPDATE content trực tiếp được chấp nhận. DỪNG, KHÔNG MERGE. '+JSON.stringify(data))}}catch(e){msg('Lỗi kiểm thử (chưa kết luận PASS): '+e.message)}};
</script></body></html>
